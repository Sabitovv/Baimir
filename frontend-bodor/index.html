<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Baytech поставляет станки и промышленное оборудование в Казахстане: лазерные станки, листогибочные станки, компрессоры, деревообработку, камнеобработку, электротехнику, запчасти и пусконаладку." />
  <meta name="theme-color" content="#FF4610" />

  <link rel="preload" as="image" href="/images/background_main-mobile.webp" type="image/webp" media="(max-width: 767px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/images/background_main-tablet.webp" type="image/webp" media="(min-width: 768px) and (max-width: 1279px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/images/background_main.webp" type="image/webp" media="(min-width: 1280px)" fetchpriority="high" />
  <link rel="preload" href="/fonts/rubik-v31-cyrillic.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
  <link rel="preload" href="/fonts/rubik-v31-latin.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />

  <style>
    /* Rubik variable font — one file per subset covers weights 300-900. */
    @font-face {
      font-family: 'Rubik';
      src: url('/fonts/rubik-v31-cyrillic.woff2') format('woff2');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      size-adjust: 100%;
      ascent-override: 103%;
      descent-override: 29%;
      line-gap-override: 0%;
    }

    @font-face {
      font-family: 'Rubik';
      src: url('/fonts/rubik-v31-latin.woff2') format('woff2');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      size-adjust: 100%;
      ascent-override: 103%;
      descent-override: 29%;
      line-gap-override: 0%;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #F6F6F6;
      font-family: 'Rubik', Arial, sans-serif;
      font-size-adjust: 0.52;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    #root>header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 50;
      height: 88px;
    }

    #root>main {
      flex: 1 1 0%;
      padding-top: 88px;
    }

    #root>main>section:first-child {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      background: #171B25;
    }

    #root>footer {
      min-height: 600px;
    }

    @media (min-width: 768px) {
      #root>footer {
        min-height: 240px;
      }
    }
  </style>

  <link rel="preconnect" href="https://tolgee.baytech.kz" crossorigin />
  <link rel="dns-prefetch" href="https://tolgee.baytech.kz" />
  <link rel="preconnect" href="https://baytech.kz" crossorigin />
  <link rel="dns-prefetch" href="https://baytech.kz" />

  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Baymir mention — commented out for the Bodor build: the original title was "Baymir".
       Do not put a literal <title> tag in this comment: server.mjs injects per-product titles
       via a non-global regex and would match the commented tag first. -->
  <title>Bodor Laser</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
